name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: read [`plan.md`](../../plan.md) §2 (locked decisions) and §11 (cut list).
        pgvector/embeddings/BM25, elkjs auto-layout, a deployed Python service, a light theme,
        and SM-2 spaced repetition were killed on purpose, not overlooked.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false
  - type: checkboxes
    id: cut-list
    attributes:
      label: Cut list
      options:
        - label: I have checked this is not on plan.md §11's cut list.
          required: true
